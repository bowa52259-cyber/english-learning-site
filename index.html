<!DOCTYPE html>
<html lang="zh-TW">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>空中英語教室 AI 學習平台</title>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100">

<div id="root"></div>

<script type="text/babel">

const {useState,useEffect} = React;

function App(){

const [lesson,setLesson]=useState(null);
const [articles,setArticles]=useState([]);
const [section,setSection]=useState(0);
const [date,setDate]=useState("");
const [quiz,setQuiz]=useState(null);
const [favorites,setFavorites]=useState(
JSON.parse(localStorage.getItem("favWords")||"[]")
);

useEffect(()=>{

fetch("articles/index.json")
.then(r=>r.json())
.then(data=>{
setArticles(data);

if(data.length>0){
loadArticle(data[0].date);
setDate(data[0].date);
}
})

},[])

function loadArticle(d){

fetch(`articles/${d}.json`)
.then(r=>r.json())
.then(data=>{
setLesson(data);
setSection(0);
setQuiz(null);
})

}

function speak(text){

let u=new SpeechSynthesisUtterance(text);
u.lang="en-US";
speechSynthesis.speak(u);

}

function toggleFav(word){

let newFav;

if(favorites.includes(word)){
newFav=favorites.filter(w=>w!==word);
}else{
newFav=[...favorites,word];
}

setFavorites(newFav);
localStorage.setItem("favWords",JSON.stringify(newFav));

}

function generateQuiz(){

let words=lesson.vocabulary;

let q=words[Math.floor(Math.random()*words.length)];

let options=[q.trans];

while(options.length<4){

let r=words[Math.floor(Math.random()*words.length)].trans;

if(!options.includes(r)) options.push(r);

}

options.sort(()=>Math.random()-0.5);

setQuiz({
word:q.word,
answer:q.trans,
options
})

}

return(

<div className="max-w-6xl mx-auto p-6">

{/* Header */}

<div className="bg-white shadow rounded-xl p-6 mb-6">

<h1 className="text-3xl font-bold">
空中英語教室 AI 學習平台
</h1>

<p className="text-gray-500">
Daily English Interactive Learning
</p>

</div>

<div className="grid grid-cols-4 gap-6">

{/* Sidebar */}

<div className="col-span-1 bg-white p-4 rounded-xl shadow">

<h2 className="font-bold mb-3">文章列表</h2>

{articles.map(a=>(
<div
key={a.date}
className="cursor-pointer p-2 hover:bg-gray-100"
onClick={()=>{

setDate(a.date)
loadArticle(a.date)

}}
>
{a.date}
<br/>
<span className="text-sm text-gray-500">
{a.title}
</span>
</div>
))}

<hr className="my-4"/>

<h2 className="font-bold mb-2">收藏單字</h2>

{favorites.map(f=>(
<div key={f}>{f}</div>
))}

</div>

{/* Article */}

<div className="col-span-3">

{lesson && (

<div className="bg-white p-6 rounded-xl shadow">

<h2 className="text-2xl font-bold">
{lesson.meta.mainTitleEn}
</h2>

<h3 className="text-gray-600 mb-4">
{lesson.meta.mainTitleZh}
</h3>

<div>

<h4 className="font-bold text-lg">
{lesson.content[section].headingEn}
</h4>

<p className="mt-2">
{lesson.content[section].contentEn}
</p>

<p className="text-gray-600 mt-2">
{lesson.content[section].contentZh}
</p>

<button
className="mt-3 bg-blue-500 text-white px-3 py-1 rounded"
onClick={()=>speak(lesson.content[section].contentEn)}
>
朗讀
</button>

</div>

<div className="flex justify-between mt-4">

<button
disabled={section===0}
onClick={()=>setSection(section-1)}
>
上一段
</button>

<button
disabled={section===lesson.content.length-1}
onClick={()=>setSection(section+1)}
>
下一段
</button>

</div>

{/* Vocabulary */}

<h3 className="text-xl font-bold mt-8">
Vocabulary
</h3>

{lesson.vocabulary.map((v,i)=>(
<div key={i} className="border-b py-3">

<b>{v.word}</b> ({v.pos})

<div>{v.trans}</div>

<div className="text-sm text-gray-500">
{v.exEn}
</div>

<button
className="text-blue-500"
onClick={()=>speak(v.word)}
>
發音
</button>

<button
className="ml-3 text-yellow-600"
onClick={()=>toggleFav(v.word)}
>
收藏
</button>

</div>
))}

{/* Quiz */}

<div className="mt-8">

<button
className="bg-green-500 text-white px-4 py-2 rounded"
onClick={generateQuiz}
>
產生單字測驗
</button>

{quiz && (

<div className="mt-4">

<h4 className="font-bold">
{quiz.word} 的意思是？
</h4>

{quiz.options.map((o,i)=>(
<div key={i}>

<button
className="border px-3 py-1 mt-1"
onClick={()=>{

if(o===quiz.answer)
alert("答對")
else
alert("答錯")

}}
>
{o}
</button>

</div>
))}

</div>

)}

</div>

</div>

)}

</div>

</div>

</div>

)

}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>)

</script>

</body>
</html>
